name: EC2 Integration Tests
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: us-west-2

jobs:
  start-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Start EC2 runner
        id: start
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.GH_PAT }}
          ec2-image-id: ${{ secrets.EC2_AMI_ID }}
          ec2-instance-type: t3.medium
          subnet-id: ${{ secrets.SUBNET_ID }}
          security-group-id: ${{ secrets.SG_ID }}

  test-ubuntu:
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip install -r requirements-ci.txt
      - name: Validate notebooks load
        run: python scripts/validate_notebooks.py

  test-arch:
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pacman -Syu --noconfirm python python-pip
          pip install --break-system-packages -r requirements-ci.txt
      - name: Validate notebooks load
        run: python scripts/validate_notebooks.py

  stop-runner:
    if: always()
    needs: [start-runner, test-ubuntu, test-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.GH_PAT }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
